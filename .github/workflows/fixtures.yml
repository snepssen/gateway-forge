# The fixtures in library/reference/ hold the TypeScript core to what the Swift
# core answers. This regenerates them from the Swift in this commit and fails
# if any differs (scripts/check-fixtures.sh), so the two cannot drift apart
# through a commit that changes one side only. On Linux too: gfcorpus's
# fixture writers are GatewayCore and Foundation alone (its audio commands
# are the Mac's), so the Linux leg answers whether Swift there writes the same
# bytes. Those fixtures are the spec a native Linux shell is held to.
name: fixtures

on:
  push:
    paths: ["Sources/**", "library/**", "scripts/check-fixtures.sh", ".github/workflows/fixtures.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: scripts/check-fixtures.sh
