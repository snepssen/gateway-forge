name: Cross-platform core

on:
  push:
    paths:
      - "cross-platform/**"
      - "library/**"
      - "focus/**"
      - "fixtures/**"
      - ".github/workflows/cross-platform.yml"
  pull_request:
    paths:
      - "cross-platform/**"
      - "library/**"
      - "focus/**"
      - "fixtures/**"
      - ".github/workflows/cross-platform.yml"

jobs:
  core:
    name: ${{ matrix.os }} / Node 22
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: cross-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cross-platform/package-lock.json
      # The checks compile the whole of `src`, which now includes the Electron
      # main process, so the build needs Electron's *types*. It does not need
      # Electron itself: nothing here launches a window. Skipping the binary
      # keeps a ~100MB download out of both runners for something they would
      # never execute.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
      - run: npm run check:ci
